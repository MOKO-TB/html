<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人信息 · 综测计算</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles.css">

  <style>
    .content {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      background: rgba(0, 0, 0, 0.6); 
    }
    .info-wrap {
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin: 20px 0;
      color: #fff;
    }
    .info-wrap p {
      font-size: 1.2rem;
      margin: 12px 0;
    }
    .info-wrap label {
      color: #f1f0ea; 
    }
    .info-wrap input {
      background: #fff;
      color: #333;
      font-size: 1rem;
    }
    .cta {
      margin-top: 10px;
    }
    .cta button {
      background: #ff6b35;
      border: none;
      padding: 12px 30px;
      border-radius: 50px;
      color: #fff;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.3s;
    }
    .cta button:hover {
      background: #e6653b;
      transform: scale(1.03);
    }
    .cta button i {
      margin-left: 8px;
    }
    #resultDisplay {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 10px;
      padding: 12px 20px;
      margin-top: 15px;
      display: inline-block;
      font-size: 1.3rem;
    }
    hr {
      margin: 25px 0;
      border: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a class="nav-items" href="02.html">首页</a>
      <a class="nav-items active" href="01.html">个人信息</a> 
    </nav>
  </header>

  <div class="content">
    <img src="bac 5.png" alt="背景层5" class="back-4">
    <img src="bac 3.png" alt="背景层3" class="back-3">
    <img src="bac 2.2.png" alt="背景层2" class="back-2">
    <img src="bac 1.png" alt="背景层1" class="back-1">
    <div class="info-wrap">
      <p><b>姓名：</b>张三</p>
      <p><b>专业：</b>计算机科学与技术</p>
      <p><b>基础学分：</b>80 分</p>

      <hr> 

      <div style="margin: 20px 0 10px 0;">
        <label for="bonusInput" style="color: #fcfbf9; font-weight: bold;">加分：</label>
        <input type="number" id="bonusInput" placeholder="例如：5" style="width:80px; padding: 5px; border-radius: 4px; border: none;">
      </div>

      <div id="resultDisplay" style="color: #fff; background: rgba(0,0,0,0.4); padding: 10px 20px; border-radius: 8px;">
        预估总分：等待计算...
      </div>

      <div class="cta">
        <button id="calcBtn">
          计算总分
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </div>

  </div>
  <script>
    var inputBox = document.getElementById('bonusInput');
    var calcBtn = document.getElementById('calcBtn');
    var resultPara = document.getElementById('resultDisplay');
    var baseScore = 80;

    calcBtn.addEventListener('click', function() {
      var bonus = Number(inputBox.value);
      if (isNaN(bonus)) bonus = 0;
      var total = baseScore + bonus;
      resultPara.innerHTML = '计算成功！预估总分为：<strong>' + total + ' 分</strong>';
    });
  </script>

</body>
</html>
