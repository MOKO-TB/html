<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人信息 · 综测计算</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles.css">

  <style>
    .content {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      background: rgba(0, 0, 0, 0.6); 
    }
    .info-wrap {
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      padding: 30px 90px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin: 20px 0;
      color: #fff;
    }
    .info-wrap p {
      font-size: 1.2rem;
      margin: 12px 0;
    }
    .info-wrap label {
      color: #f1f0ea; 
    }
    .info-wrap input, .info-wrap select {
      background: #fdfcfc;
      color: #333;
      font-size: 1rem;
    }
    .cta {
      margin-top: 10px;
    }
    .cta button {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      padding: 12px 30px;
      border-radius: 50px;
      color: #fff;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.3s;
      margin-right: 10px;
    }
    .cta button:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.03);
    }
    .cta button i {
      margin-left: 8px;
    }
    #resultDisplay {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 10px;
      padding: 12px 20px;
      margin-top: 15px;
      display: inline-block;
      font-size: 1.3rem;
    }
    hr {
      margin: 25px 0;
      border: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.3);
    }
    .record-section {
      margin-top: 25px;
      text-align: left;
    }
    .record-section h4 {
      margin-bottom: 10px;
      color: #fcfbf9;
    }
    #recordList {
      list-style: none;
      padding: 0;
      max-height: 200px;
      overflow-y: auto;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 10px;
    }
    #recordList li {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      font-size: 0.95rem;
    }
    #recordList li:last-child {
      border-bottom: none;
    }
     .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: visibility 0.3s, opacity 0.3s;
    }
    .modal-overlay.show {
      visibility: visible;
      opacity: 1;
    }
    .modal-box {
      background: rgba(18, 22, 32, 0.5);
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
      border-radius: 20px;
      padding: 30px 35px;
      max-width: 480px;
      width: 90%;
      color: #fff;
      box-shadow: 0 15px 40px rgba(100, 89, 89, 0.8);
      border: 1px solid rgba(255,255,255,0.2);
      text-align: center;
    }
    .modal-box h3 {
      margin-top: 0;
      font-size: 1.6rem;
      color: #ff6b35;
    }
    .modal-result {
      background: rgba(0,0,0,0.4);
      padding: 15px;
      border-radius: 12px;
      margin: 20px 0;
      font-size: 1.2rem;
    }
    .modal-records {
      text-align: left;
      max-height: 200px;
      overflow-y: auto;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 20px;
    }
    .modal-records ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .modal-records li {
      padding: 6px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      font-size: 0.95rem;
    }
    .modal-records li:last-child {
      border-bottom: none;
    }
    .modal-close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      padding: 10px 30px;
      border-radius: 50px;
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }
    .modal-close-btn:hover {
  background: rgba(255, 255, 255, 0.2) !important;
  transform: scale(1.03);
  transition: all 0.2s;
}


  </style>
</head>
<body>

  <header>
    <nav>
      <a class="nav-items" href="02.html">首页</a>
      <a class="nav-items active" href="01.html">个人信息</a> 
    </nav>
  </header>

  <div class="content">
    <img src="bac 5.png" alt="5" class="back-4">
    <img src="bac 3.png" alt="3" class="back-3">
    <img src="bac 2.2.png" alt="2" class="back-2">
    <img src="bac 1.png" alt="1" class="back-1">
    <div class="info-wrap">
      <p><b>姓名：</b>张三</p>
      <p><b>专业：</b>计算机科学与技术</p>
      <p><b>基础学分：</b>80 分</p>

      <hr> 

      <div style="margin: 20px 0 10px 0;">
        <label for="bonusInput" style="color: #fcfbf9; font-weight: bold;">加分：</label>
        <input type="number" id="bonusInput" placeholder="例如：5" style="width:80px; padding: 5px; border-radius: 4px; border: none;">
      </div>
      <div style="margin: 15px 0 10px 0;">
        <label for="reasonSelect" style="color: #fcfbf9; font-weight: bold;">加分原因：</label>
        <select id="reasonSelect" style="padding: 5px; border-radius: 4px; border: none; width:150px;">
          <option value="竞赛获奖">竞赛获奖</option>
          <option value="优秀班干">优秀班干</option>
          <option value="志愿服务">志愿服务</option>
        </select>
      </div>

      <div id="resultDisplay" style="color: #fff; background: rgba(0,0,0,0.4); padding: 10px 20px; border-radius: 8px;">
        预估总分：等待计算...
      </div>

      <div class="cta">
        <button id="calcBtn">
          计算总分
          <i class="fa-solid fa-arrow-right"></i>
        </button>
        <button id="clearBtn" style="background: rgba(255, 255, 255, 0.1);">
          清空记录
          <i class="fa-solid fa-rotate-left"></i>
        </button>
      </div>

      <div class="record-section">
        <h4>加分记录</h4>
        <ul id="recordList">
          <li>暂无记录</li>
        </ul>
      </div>
    </div>
  </div>
<div class="modal-overlay" id="customModal">
    <div class="modal-box">
      <h3>计算成功！</h3>
      <div class="modal-result" id="modalTotal">
      </div>
      <div class="modal-records">
        <strong>加分记录：</strong>
        <ul id="modalRecordList">
        </ul>
      </div>
      <button class="modal-close-btn" id="closeModalBtn" style="background: rgba(255, 255, 255, 0.1);" >关闭</button>
    </div>
  </div>
  <script>
    var records = [];

    var inputBox = document.getElementById('bonusInput');
    var reasonSelect = document.getElementById('reasonSelect');
    var calcBtn = document.getElementById('calcBtn');
    var clearBtn = document.getElementById('clearBtn');
    var resultDisplay = document.getElementById('resultDisplay');
    var recordList = document.getElementById('recordList');
    var baseScore = 80;
    var modal = document.getElementById('customModal');
    var modalTotal = document.getElementById('modalTotal');
    var modalRecordList = document.getElementById('modalRecordList');
    var closeModalBtn = document.getElementById('closeModalBtn');


    function closeModal() {
      modal.classList.remove('show');
    }
    closeModalBtn.addEventListener('click', closeModal);
     modal.addEventListener('click', function(e) {
      if (e.target === modal) {
        closeModal();
      }
    });

    calcBtn.addEventListener('click', function() {
      var input = inputBox.value;
      var reason = reasonSelect.value;
      var x = Number(input);
      if (isNaN(x) || x <= 0) {
        resultDisplay.innerText = '错误：加分必须大于0！';
        return;
      }

      var total = baseScore + x;
      resultDisplay.innerText = '计算成功！预估总分为：' + total + ' 分（加分原因：' + reason + '）';
      var recordStr = reason + ' +' + x + ' 分，当前总分：' + total;
      records.push(recordStr);
      console.log(records);
      var listHtml = '';
      for (var i = 0; i < records.length; i++) {
        listHtml += '<li>' + records[i] + '</li>';
      }
      recordList.innerHTML = listHtml;
       console.log(records);

  
      modalTotal.innerText = '预估总分：' + total + ' 分（加分原因：' + reason + '）';
      var modalListHtml = '';
      for (var j = 0; j < records.length; j++) {
        modalListHtml += '<li>' + records[j] + '</li>';
      }
      modalRecordList.innerHTML = modalListHtml;

      modal.classList.add('show');
    });
    clearBtn.addEventListener('click', function() {
      inputBox.value = '';
      resultDisplay.innerText = '预估总分：等待计算...';
      records = [];
      recordList.innerHTML = '<li>暂无记录</li>';
    });
  </script>

</body>
</html>
