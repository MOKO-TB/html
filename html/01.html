<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个人信息展示区</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="box">
    <h1><b>广州应用科技学院 - 个人信息</b></h1>
    <p><b>姓名：</b>张三</p>
    <p><b>专业：</b>计算机科学与技术</p>
    <p><b>基础学分：</b>80 分</p>
    <hr>
    <h1><b>综测加分计算器</b></h1>
    <div style="margin: 20px 0 10px 0;">
        <label for="scoreInput">加分：</label>
        <input type="number" id="scoreInput" placeholder="例如：5" style="width:80px;">
        <label for="reasonSelect">加分原因：</label>
        <select id="reasonSelect" style="width:150px;">
            <option value="竞赛获奖">竞赛获奖</option>
            <option value="优秀班干">优秀班干</option>
            <option value="志愿服务">志愿服务</option>
        </select>
        <button id="calcBtn">计算总分</button>
        <button id="clearBtn">清空记录</button>
    </div>

    <div class="result" id="result">
        预估总分：等待计算...
    </div>
    <div class="record-section">
        <h4>加分记录</h4>
        <ul id="recordList">
            <li>暂无记录</li>
        </ul>
    </div>
</div>

<script>
var records = [];
var scoreInput = document.getElementById('scoreInput');
var reasonSelect = document.getElementById('reasonSelect');
var calcBtn = document.getElementById('calcBtn');
var clearBtn = document.getElementById('clearBtn');
var resultDiv = document.getElementById('result');
var recordList = document.getElementById('recordList');
var baseScore = 80;

function calculate() {
    var input = scoreInput.value;
    var reason = reasonSelect.value;
    var x = Number(input);

    if (isNaN(x) || x <= 0) {
        resultDiv.innerText = '错误：加分必须大于0！';
        return;
    }

    var total = baseScore + x;
    resultDiv.innerText = '计算成功！预估总分为：' + total + ' 分（加分原因：' + reason + '）';

    var recordStr = reason + ' +' + x + ' 分，当前总分：' + total;
    records.push(recordStr);
    console.log('加分记录数组：', records);

    var listHtml = '';
    for (var i = 0; i < records.length; i++) {
        listHtml += '<li>' + records[i] + '</li>';
    }
    recordList.innerHTML = listHtml;
}

function clearAll() {
    scoreInput.value = '';
    resultDiv.innerText = '预估总分：等待计算...';
    records = [];
    recordList.innerHTML = '<li>暂无记录</li>';
    console.log('记录已清空，当前数组：', records);
}

calcBtn.addEventListener('click', calculate);
clearBtn.addEventListener('click', clearAll);
scoreInput.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        event.preventDefault();
        calculate();
    }
});
</script>
</body>
</html>
